# LAB MODEL of angular/angular .github/workflows/benchmark-compare.yml
# Faithful to the structure that creates the TOCTOU, but self-contained:
#   - no real secrets: BENCH_RESULTS_TOKEN / BENCH_MEMBERSHIP_TOKEN are fictional repo
#     secrets you set to the literal string LAB_CANARY_<something> (never a real PAT).
#   - the "team membership" gate is modeled by checking the commenter against a repo
#     variable TEAM_MEMBERS (comma list) instead of a real org team + org token.
#   - the attacker code path only reads the fictional token from a LATER step's env and
#     writes sha256(token) to the job summary. It performs NO network callback.
#
# The vulnerable property reproduced 1:1:
#   (a) issue_comment trigger => runs on the DEFAULT branch, no fork-approval gate;
#   (b) the PR head SHA is resolved LIVE at run time (pull-request-comment-branch step),
#       NOT pinned to the SHA the member saw => race window;
#   (c) checkout of head_owner/head_repo@head_sha followed by running the fork's code
#       (install + benchmarks) in a context that holds secrets.
name: Run benchmark comparison (LAB)

on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  benchmark-compare:
    runs-on: ubuntu-latest
    # Model of the angular/team membership gate (step 1 in the original).
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark-compare ') }}
    steps:
      # ---- Gate: commenter must be a "team member" (repo variable, lab stand-in) ----
      - name: Team membership gate (lab stand-in for actions-team-membership)
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          TEAM_MEMBERS: ${{ vars.TEAM_MEMBERS }}
        run: |
          echo "Commenter: $COMMENTER"
          case ",$TEAM_MEMBERS," in
            *",$COMMENTER,"*) echo "team member OK" ;;
            *) echo "::error::not a team member"; exit 1 ;;
          esac

      # Window = job startup + gate/reaction latency the real job spends BEFORE it
      # resolves the head SHA (measured ~13 s on run 29689973609: comment 14:00:29Z ->
      # SHA resolved 14:00:42Z). The attacker force-pushes during THIS window, so the
      # live resolution below picks up the malicious commit instead of the reviewed one.
      # Remove it and the race still exists against natural startup latency, just narrower.
      - name: Startup/gate latency (models pre-resolution window)
        run: sleep 13

      # ---- TOCTOU core: resolve the PR head ref/sha LIVE, like the real action ----
      # The real workflow uses alessbell/pull-request-comment-branch@ef3408c, which
      # resolves headRef.target.oid via a GraphQL query AT RUN TIME. We reproduce that
      # exact behaviour with a gh api call so the lab needs no third-party action.
      - name: Resolve PR head (live) — models pull-request-comment-branch
        id: comment-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # REST pulls.get mirrors what pull-request-comment-branch reads: the PR's
          # CURRENT head (sha/ref/repo), resolved live — not pinned to the reviewed sha.
          data=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          echo "head_sha=$(echo "$data"   | jq -r '.head.sha')"            >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$data"   | jq -r '.head.ref')"            >> "$GITHUB_OUTPUT"
          echo "head_owner=$(echo "$data" | jq -r '.head.repo.owner.login')">> "$GITHUB_OUTPUT"
          echo "head_repo=$(echo "$data"  | jq -r '.head.repo.name')"      >> "$GITHUB_OUTPUT"
          echo "resolved head_sha=$(echo "$data" | jq -r '.head.sha')"

      - name: Checkout PR branch (fork, live sha)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.comment-branch.outputs.head_owner }}/${{ steps.comment-branch.outputs.head_repo }}
          ref: ${{ steps.comment-branch.outputs.head_sha }}
          persist-credentials: false

      # Running the fork's code. In the real workflow this is `pnpm install` +
      # `pnpm benchmarks ...`. Here it is the repo's own benchmarks/run.sh, which the
      # attacker overwrites on the raced commit.
      - name: Run benchmark (executes fork code)
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          chmod +x ./benchmarks/run.sh || true
          ./benchmarks/run.sh "$COMMENT_BODY"

      # Models angular dev-infra bazel/setup's actions/cache step, which runs IN THIS
      # SAME job and SAVES ~/.cache/bazelisk at post-job time. The attacker's run.sh
      # (previous step) planted a poisoned ~/.cache/bazelisk/bazelisk, so this trusted
      # cache step persists it. THE FEASIBILITY QUESTION: this job is issue_comment, so
      # its ref is the default branch — can its SAVE be restored later by a push job?
      # We save under a unique prefix-matching key so a consumer's exact-key miss falls
      # back to the prefix and (by most-recent-wins) should pick this attacker entry.
      - name: Bazel setup cache (models dev-infra bazel/setup, saves attacker dir)
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazelisk
          key: bazel-cache-Linux-FROMCOMMENT-${{ github.run_id }}
          restore-keys: |
            bazel-cache-Linux-

      - name: Post results (holds fictional token)
        env:
          BENCH_RESULTS_TOKEN: ${{ secrets.BENCH_RESULTS_TOKEN }}
          BENCH_MEMBERSHIP_TOKEN: ${{ secrets.BENCH_MEMBERSHIP_TOKEN }}
        run: |
          echo "would post benchmark results using BENCH_RESULTS_TOKEN"
